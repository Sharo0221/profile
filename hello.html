<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f0e1;
            font-family: -apple-system, sans-serif;
        }
        h1 {
            color: #333;
            font-family: 'Brush Script MT', cursive;
            font-size: 5rem;
            margin-bottom: 30px;
        }
        input {
            padding: 10px 16px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            outline: none;
            width: 280px;
            text-align: center;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #999;
        }
        #output {
            color: #4a4a4a;
            font-size: 3.5rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 500;
            letter-spacing: 2px;
            margin-top: 20px;
            min-height: 24px;
            transition: color 0.3s;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <input type="text" placeholder="请输入内容">
    <p id="output"></p>
    <script>
        document.querySelector('input').addEventListener('input', function(e) {
            document.getElementById('output').textContent = e.target.value;
        });
    </script>
</body>
</html>
